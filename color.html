<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#f6f6f8;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:#e8501d;text-decoration:none}a:hover{color:#c33e12}
</style>
</helmet>
<div style="display:flex;height:100vh;min-height:640px;background:#f6f6f8">
  <div style="width:248px;flex:none;background:#1e222c;display:flex;flex-direction:column">
    <div style="display:flex;align-items:center;gap:11px;padding:22px 20px 18px">
      <div style="width:36px;height:36px;border-radius:10px;background:#f1592a;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px">B</div>
      <div><div style="font-size:15px;font-weight:700;color:#f2f3f6;letter-spacing:.2px">Buuruljuut</div><div style="font-size:9px;letter-spacing:2.5px;color:#ff8a5c;text-transform:uppercase">power plant</div></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:3px;padding:10px 14px">
      <sc-for list="{{ navItems }}" as="nav" hint-placeholder-count="5">
        <div onClick="{{ nav.select }}" style="display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:9px;font-size:14px;cursor:pointer;background:{{ nav.bg }};color:{{ nav.color }};font-weight:{{ nav.weight }}" style-hover="background:#2a2f3b;color:#ffffff">
          <span style="display:flex;color:{{ nav.iconColor }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" dangerouslySetInnerHTML="{{ nav.icon }}"></svg></span>
          <span>{{ nav.label }}</span>
          <sc-if value="{{ nav.expandable }}" hint-placeholder-val="{{ false }}"><svg style="margin-left:auto" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"></path></svg></sc-if>
        </div>
      </sc-for>
    </div>
    <div style="margin-top:auto;padding:16px;border-top:1px solid #2a2f3b;display:flex;flex-direction:column;gap:13px">
      <div style="display:flex;align-items:center;gap:10px"><div style="width:34px;height:34px;border-radius:50%;background:#f1592a;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700">A</div><div><div style="font-size:13px;font-weight:600;color:#f2f3f6">Админ. Супер</div><div style="font-size:11px;color:#8b93a1">Систем администратор</div></div></div>
      <div style="display:flex;align-items:center;justify-content:center;gap:8px;padding:10px;background:#272c38;border-radius:9px;color:#c9cdd6;font-size:13px;font-weight:600;cursor:pointer" style-hover="background:#313745;color:#ffffff" style-active="background:#3a4151"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="M16 17l5-5-5-5"></path><path d="M21 12H9"></path></svg>Гарах</div>
    </div>
  </div>
  <div style="flex:1;display:flex;flex-direction:column;min-width:0">
    <div style="height:64px;flex:none;background:#ffffff;border-bottom:1px solid #ecedf0;display:flex;align-items:center;gap:18px;padding:0 24px">
      <div style="display:flex;align-items:center;gap:10px;background:#f2f3f6;border-radius:99px;padding:9px 18px;width:300px;color:#9aa1ad;font-size:13.5px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.35-4.35"></path></svg>Хайлт хийх...</div>
      <div style="margin-left:auto;position:relative;color:#5a6472;cursor:pointer" style-hover="color:#1c2430"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg><div style="position:absolute;top:-2px;right:-1px;width:8px;height:8px;border-radius:50%;background:#f1592a;border:2px solid #ffffff"></div></div>
      <div style="display:flex;align-items:center;gap:10px;border-left:1px solid #ecedf0;padding-left:18px"><div style="text-align:right"><div style="font-size:13.5px;font-weight:700;color:#1c2430">Админ. Супер</div><div style="font-size:11px;color:#8b93a1">Систем администратор</div></div><div style="width:34px;height:34px;border-radius:50%;background:#1e222c;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700">A</div></div>
    </div>
    <div style="flex:1;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:16px">
      <div><div style="font-size:20px;font-weight:700;color:#1c2430">{{ pageTitle }}</div><div style="font-size:13px;color:#8b93a1;margin-top:3px">Өнөөдөр, 2026 оны 8-р сарын 17</div></div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px">
        <div style="background:#ffffff;border:1px solid #ecedf0;border-radius:12px;padding:18px"><div style="font-size:11px;color:#8b93a1;text-transform:uppercase;letter-spacing:.6px">Нийт ажилтан</div><div style="font-size:28px;font-weight:700;color:#1c2430;margin-top:6px">248</div><div style="font-size:12px;color:#e8501d;margin-top:3px">+4 энэ сард</div></div>
        <div style="background:#ffffff;border:1px solid #ecedf0;border-radius:12px;padding:18px"><div style="font-size:11px;color:#8b93a1;text-transform:uppercase;letter-spacing:.6px">Хүлээгдэж буй хүсэлт</div><div style="font-size:28px;font-weight:700;color:#1c2430;margin-top:6px">12</div><div style="font-size:12px;color:#8b93a1;margin-top:3px">3 нь яаралтай</div></div>
        <div style="background:#ffffff;border:1px solid #ecedf0;border-radius:12px;padding:18px"><div style="font-size:11px;color:#8b93a1;text-transform:uppercase;letter-spacing:.6px">KPI гүйцэтгэл</div><div style="font-size:28px;font-weight:700;color:#1c2430;margin-top:6px">86%</div><div style="height:5px;border-radius:3px;background:#f2f3f6;margin-top:10px"><div style="width:86%;height:100%;border-radius:3px;background:#f1592a"></div></div></div>
      </div>
      <div style="flex:1;min-height:260px;background:#ffffff;border:1px solid #ecedf0;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#c3c8d1;font-size:14px">Контентын хэсэг</div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;activeStyle&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;solid&quot;,&quot;options&quot;:[&quot;solid&quot;,&quot;subtle&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Sidebar&quot;}}">
class Component extends DCLogic {
  state = { active: 0 };
  renderVals() {
    const icons = [
      '<path d="M3 10.5 12 3l9 7.5V21h-6v-6h-6v6H3z"></path>',
      '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V2H6.5A2.5 2.5 0 0 0 4 4.5z"></path><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20"></path>',
      '<path d="M20 12v9H4v-9"></path><path d="M2 7h20v5H2z"></path><path d="M12 21V7"></path>',
      '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>',
      '<path d="M18 20V10"></path><path d="M12 20V4"></path><path d="M6 20v-6"></path>'
    ];
    const labels = ['Миний самбар', 'Дүрэм журам', 'Benefits', 'Self Service', 'KPI'];
    const expandable = [false, false, true, true, true];
    const activeStyle = this.props.activeStyle ?? 'solid';
    const navItems = labels.map((label, i) => {
      const isActive = i === this.state.active;
      return {
        label, expandable: expandable[i],
        icon: { __html: icons[i] },
        bg: isActive ? (activeStyle === 'solid' ? '#f1592a' : '#2a2f3b') : 'transparent',
        color: isActive ? '#ffffff' : '#a7adba',
        iconColor: isActive ? (activeStyle === 'solid' ? '#ffffff' : '#ff8a5c') : '#a7adba',
        weight: isActive ? 600 : 400,
        select: () => this.setState({ active: i })
      };
    });
    return { navItems, pageTitle: labels[this.state.active] };
  }
}
</script>
</body>
</html>
